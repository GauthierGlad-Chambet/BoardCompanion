services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boardCompanion
    ports:
      - "8080:80"
    volumes:
      # Le code est déjà dans l'image (pas de bind mount) : seuls .env et les uploads
      # doivent survivre en dehors de l'image / persister entre redémarrages.
      - ./src/.env:/var/www/html/.env
      - uploads-data:/var/www/html/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:9.1
    container_name: boardCompanion-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
