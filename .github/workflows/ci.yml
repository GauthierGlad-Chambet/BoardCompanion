name: CI/CD

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  tests:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Install dependencies (avec dev, pour PHPUnit)
        working-directory: ./src
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPUnit
        working-directory: ./src
        run: vendor/bin/phpunit

  build-prod-image:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Docker de production
        run: docker build -f Dockerfile -t boardcompanion:prod-test .
